name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (M1+); macos-13 = Intel
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar
        run: python -m pip install -e ".[dev,sim]"
      - name: Testes
        run: python -m pytest -q
      - name: Autoteste (sistema, SDL, hidapi, Qt, mouse)
        run: python -m capybara_lightgun selftest
      - name: Instalador do macOS (sintaxe e autoteste do pacote instalado)
        if: runner.os == 'macOS'
        run: |
          bash -n installer/macos/install.sh
          bash -n installer/macos/uninstall.sh
